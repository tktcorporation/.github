name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # npm@latest だと npm のメジャーアップデートで registry 応答の形式が変わり、
      # changesets の公開済みバージョン検出が壊れることがある。動作確認済みのバージョンを
      # package.json#releaseNpmVersion に SSOT として宣言し、ここで読み取って固定する。
      # npm の engines フィールドは互換範囲の宣言用であり、単一バージョンの固定に使うと
      # npm/pnpm の EBADENGINE 警告と意味が衝突するため、専用フィールドにしている。
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@"$(node -p "require('./package.json').releaseNpmVersion")"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
