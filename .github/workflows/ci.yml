name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check bin.mjs syntax
        run: node --check packages/ziku-cli/bin.mjs

      - name: Validate ziku.jsonc
        run: node scripts/validate-jsonc.mjs

      - uses: oven-sh/setup-bun@v2

      - name: Install hook dependencies
        # hook は Bash の構文解析に使う依存を初回の import 時に入れる。入れた直後の同じプロセスでは
        # 読み込めないので、テストより先に入れておく。
        working-directory: .claude/hooks
        run: bun --eval "await (await import('./ensure-bash-parser-deps.ts')).ensureBashParserDeps(process.cwd())"

      - name: Test review-loop hooks
        # bun test は隠しディレクトリを探索しないため、hooks ディレクトリで実行する。
        working-directory: .claude/hooks
        run: bun test
