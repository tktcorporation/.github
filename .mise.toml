[tools]
node = ["22", "24"]
uv = "latest"
python = "3.14"
pnpm = "10"
jj = "latest"
process-compose = "latest"
stripe-cli = "latest"
opentofu = "latest"
flyctl = "latest"
direnv = "latest"
# infra/secrets を age で暗号化するための SOPS/age。
# age は公開鍵暗号で、秘密鍵 ~/.config/sops/age/keys.txt を root of trust とする。
# sops は YAML/env ファイルを in-place 暗号化し、decrypt した出力を tofu data source に渡す。
sops = "latest"
age = "latest"

"npm:@anthropic-ai/claude-code" = { version = "latest", npm_args = "--ignore-scripts=false --include=optional" }
"npm:@openai/codex" = "latest"
"npm:@google/gemini-cli" = "latest"

"npm:@antfu/ni" = "latest"

# Browser automation
"npm:playwright" = "latest"


[settings]
experimental = true
# .nvmrcファイルを自動的に読み込む設定
legacy_version_file = true
# ディレクトリ移動時に自動的にツールをインストール
auto_install = true

# pipx バックエンドで uvx を使う設定
pipx.uvx = true

[tasks.chromium-path]
run = "ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1"
description = "Get Playwright Chromium executable path"

[tasks.ziku]
run = "npx ziku@latest"
description = "Run ziku CLI"

# Claude Code hook の委譲先。汎用 hook (.claude/hooks/{post-lint,stop-verify}.sh) は
# 「ファイル抽出 → mise 委譲 → JSON 整形」だけを担い、実コマンドはプロジェクト固有の
# この task に置く、という ziku テンプレートの責務分離に従う。task 名は hook が
# `mise tasks ls` で存在確認する固定値なので変更しないこと。
#
# vp(oxc) 非依存方針: この環境では vp の native worker (oxlint/oxfmt/vitest) が spawn 後に
# 無限ハングする（バージョン非依存・config 非依存で再現）。そのため hook からは vp を一切
# 呼ばない。oxlint/oxfmt(=vp check)・vitest(=vp test run)・flow-doc:check(内部で vp fmt を
# 呼ぶ) はローカルで実行不能なので CI と push 前検証(.claude/rules/ci-workflow.md)
# に委譲し、ここでは vp を介さず動く静的チェック(tsc / ast-grep / node スクリプト)だけを走ら
# せる。vp が健全な環境に移れば、verify の chk に `vp check` / `vp test run` を戻せばよい。
#
# 既定で有効。一時的に無効化したいときは CLAUDE_SKIP_HOOKS=1 を環境に設定する。

[tasks.claude-postedit]
description = "Claude post-edit hook 委譲先: 編集ファイル単体を ast-grep で lint(報告のみ)。CLAUDE_SKIP_HOOKS=1 で無効化"
# vp/oxc が使えないため per-file の oxfmt 整形は行えない。代わりに ast-grep の project rules
# (custom_id 重複検知など) を編集ファイル単体にかけ、違反を即時報告する。報告のみで自動修正は
# しない（rule 違反はエージェント自身に直させる）。対象は JS/TS 系のみ。それ以外・依存未
# インストールは hook 仕様どおり no-op (exit 0)。
run = '''
[ "${CLAUDE_SKIP_HOOKS:-0}" = 1 ] && exit 0
set +e  # mise は task を errexit 付きで実行する。下で exit code を分岐するため無効化する。
file="{{arg(name="file")}}"
[ -f "$file" ] || exit 0
case "$file" in
  *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs) ;;
  *) exit 0 ;;
esac
root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0
ag="$root/node_modules/.bin/ast-grep"
[ -x "$ag" ] || exit 0  # 依存未インストール環境では検査不能なので no-op
# sgconfig.yml はリポジトリルートにあるので root から実行する。万一ハングしても編集を
# ブロックしないよう timeout で必ず終了させ、出力はファイル経由にして command-substitution の
# フリーズを防ぐ。
log="$(mktemp)"
( cd "$root" && timeout -k 5 30 "$ag" scan "$file" ) >"$log" 2>&1
rc=$?
# タイムアウト(>=124)・違反なし(0) はどちらも no-op。それ以外は ast-grep 診断を返す。
if [ "$rc" -ge 124 ] || [ "$rc" = 0 ]; then rm -f "$log"; exit 0; fi
cat "$log"; rm -f "$log"; exit "$rc"
'''

[tasks.claude-verify]
description = "Claude stop hook 委譲先: 完了前に CI 相当の静的チェック(型/ast-grep/node lint)を vp 非依存で実行。CLAUDE_SKIP_HOOKS=1 で無効化"
run = '''
[ "${CLAUDE_SKIP_HOOKS:-0}" = 1 ] && exit 0
set +e  # mise の errexit を無効化（複数チェックを走らせて結果を集約するため）。
# コード変更が無い会話ターンはスキップする。ただし「作業ツリーがクリーン」だけで判定すると、
# 編集を commit 済みのターンで作業ツリーが空になり、未検証のまま完了を素通りしてしまう。
# そこで origin の default branch との差分も確認し、commit/push 済みでも差分があれば検証する。
if [ -z "$(git status --porcelain 2>/dev/null)" ]; then
  default_ref="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null || echo refs/remotes/origin/main)"
  if git rev-parse --verify "$default_ref" >/dev/null 2>&1; then
    # git diff の終了コードを && で捕捉する。shallow clone 等で diff が失敗すると stdout は空に
    # なるが、[ -z ... ] 単体だと「差分なし」と誤判定してスキップしてしまう。diff 失敗時は
    # && が短絡してフォールスルーし、検証を続行する（安全側）。
    diff_out="$(git diff "$default_ref"...HEAD --name-only 2>/dev/null)" && [ -z "$diff_out" ] && exit 0
  fi
  # default branch ref が解決できない環境では安全側に倒して検証を続行する。
fi
root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0
cd "$root" || exit 0  # set +e 下では cd 失敗が素通りするため明示ガード（誤ったディレクトリでの実行を防ぐ）
# 依存未インストール（fresh clone で install 前）の環境では検証不能なのでスキップ。
# ここで止めると Stop hook が module-not-found の暗号的エラーで完了をブロックし続ける。
[ -d node_modules ] || exit 0
log="$(mktemp)"
rc=0
# 各チェックを timeout で必ず終了させ、出力はファイル経由にして hook 側の command-substitution
# がフリーズするのを防ぐ。これらは本来ハングしないツールなので、timeout(>=124) は異常として
# 失敗扱いにする（要調査シグナル）。
chk() { lbl="$1"; t="$2"; shift 2; timeout -k 5 "$t" "$@" >>"$log" 2>&1; r=$?; if [ "$r" -ge 124 ]; then echo "[FAIL] timed out (${t}s): $lbl" >>"$log"; rc=1; elif [ "$r" != 0 ]; then rc=1; fi; }
# CI(.github/workflows/ci.yml) のうち vp を介さず実行できるものだけを展開する。
# vp check(oxlint/oxfmt)・vp test run・flow-doc:check(内部で vp fmt) はこの環境ではハングする
# ため CI / push 前に委譲する（このブロック冒頭のコメント参照）。
chk "typecheck (tsc)"         120 sh -c 'cd worker && pnpm typecheck'
chk "ast-grep (lint:effect)"   60 node_modules/.bin/ast-grep scan
chk "node-version 整合"         30 node --experimental-strip-types scripts/check-node-version-alignment.ts
chk "discord response lint"     30 node --experimental-strip-types scripts/lint-discord-response.ts
[ "$rc" = 0 ] && { rm -f "$log"; exit 0; }
cat "$log"; rm -f "$log"; exit "$rc"
'''
